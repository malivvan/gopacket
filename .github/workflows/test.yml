name: "test"

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: 'go.sum'
      - run: go version
      - name: Build
        run: go build -v ./...
      - name: Test
        run: go test -v ./...
